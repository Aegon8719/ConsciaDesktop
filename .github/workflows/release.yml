name: Build and release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build prerequisites
        run: pacman -Syu --noconfirm --needed git python sudo
      - uses: actions/checkout@v4
      - name: Require the release tag to match versions.lock
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('versions.lock'))['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag must equal v' + version)
          PY
      - name: Prepare unprivileged builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Compile locked forks and package full release
        run: |
          sudo -u builder bash -c 'cd "$1"; bash scripts/build-offline.sh' bash "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: ConsciaDesktop-Arch-x86_64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ConsciaDesktop-Arch-x86_64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
