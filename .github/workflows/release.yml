name: Build and release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build prerequisites
        run: pacman -Syu --noconfirm --needed git python sudo
      - uses: actions/checkout@v4
      - name: Require the release tag to match versions.lock
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('versions.lock'))['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag must equal v' + version)
          PY
      - name: Prepare unprivileged builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Compile locked forks and package full release
        run: |
          sudo -u builder bash -c 'cd "$1"; bash scripts/build-offline.sh' bash "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: ConsciaDesktop-Arch-x86_64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check for an existing release
        id: existing
        run: |
          tags=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$tags"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already exists; keeping its assets unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          name: ConsciaDesktop-Arch-x86_64
          path: dist
      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
